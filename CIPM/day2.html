<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>CIPM Day 2</title></head><body><script src='app.js'></script><script>CIPM.day({n:2,ch:'CHAPTER 2',title:'Privacy governance:<br>building the program',intro:`Chapter 2 is where the exam moves from vocabulary to decisions: what goes into a privacy program, how to scope it, which framework to use and how to structure the team. Plan sessions 2 to 4 (Sat 21 to Mon 23 Nov): steps 1-2 first, steps 3-5 next, steps 6-7 and the mastery check last.`,steps:[{t:'Vision and mission',m:5,h:'Where governance starts',b:`<p><b>Privacy governance</b> means the components that guide the privacy function toward compliance and let it support the organization's broader business objectives. Chapter 2 lists five: create the organizational privacy <b>vision and mission statement</b>, define the <b>scope</b> of the program, select an appropriate <b>framework</b>, develop the <b>privacy strategy</b>, and structure the <b>privacy team</b>.</p><p>The vision and mission statement is described as the key factor that lays the groundwork for the rest of the program. Know how it is built:</p><ul><li>It aligns with the organization's broader purpose and business objectives, which can change as the business changes.</li><li>It is refined with feedback from key stakeholders, then reviewed and approved by <b>executive leadership</b>.</li><li>It is a few short sentences describing the reason the privacy function exists. A mission statement should take less than 30 seconds to read.</li><li>Alternatively, privacy can be covered inside the organization's overall mission statement or code of conduct.</li></ul><div class='trap'><b>Exam trap:</b> the right mission statement is short, realistic and tied to compliance and the organization's goals. Statements that promise to stop all breaches, or set very specific long-term numbers, are wrong answers.</div>`},{t:'Defining scope',m:6,h:'What is in the program',b:`<p>Defining <b>program scope</b> is a two-step approach: (1) identify the personal information collected and processed, then (2) identify the applicable privacy and data protection laws and regulations. Data first, laws second.</p><p><b>Step 1: find the data.</b> A lighter approach is information-gathering interviews with the functions that typically handle personal information: HR, marketing, finance and IT/information security. Internal audit, data governance or information security can help with data discovery. Manual work is slow in large organizations; a more automated, structured exercise across the data life cycle gives more accurate inventories and data maps. Organizations subject to the GDPR should favor the thorough approach because Article 30 formalizes written records of processing.</p><p>Key scoping questions: who collects, uses and maintains personal information (including service providers)? What types and for what purpose? Where is it stored (systems and countries)? To whom is it transferred? Who has access, internally and externally? When and how is it collected? How long is it retained and how is it deleted? What security controls protect it?</p><p><b>Step 2: find the laws.</b> One data set may fall under more than one regulation (for example health care plus financial reporting rules), and offering services to people in other countries brings global obligations. If you operate where data protection law is inadequate or missing, apply your organization's requirements at the highest level achievable instead of dropping to the local level. Best practice is the most restrictive policy, not the least restrictive.</p><p><b>Scope challenges.</b> Domestic programs may only track state or regional and industry laws; global programs must also handle cultural differences. The classic contrast: the US takes a limited sectoral approach, the EU a comprehensive one. A successful approach requires understanding the end-to-end data life cycle, a global perspective, customizing approaches globally and locally, awareness of translation and enforcement issues, and monitoring all legal factors. Tracking breach notification laws across locations is complex, and third-party tools can help.</p><div class='trap'><b>Exam trap:</b> scoping starts with what data you hold, not with picking a framework or naming a DPO.</div>`},{t:'Strategy and stakeholders',m:6,h:'Developing the privacy strategy',b:`<p>A <b>privacy strategy</b> is the organization's approach to communicating and supporting the privacy program and its vision. There is no one-size-fits-all strategy. Everyone contributes: management approves funding and holds people accountable; sales secures business contact data and respects choices; developers build in security and collect only necessary data; all staff protect data in collection, storage, transmission and destruction. The chain is only as strong as its weakest link, and the strategy needs a destination and a road map to win buy-in.</p><p><b>2.3.1 Identify stakeholders and internal partnerships.</b> Build consensus in stages, starting with informal one-on-one conversations with executives accountable for information management, security, risk, compliance or legal decisions. Start with the most senior leader in your division and work up. A privacy team often sits under the general counsel, which can be a good first step in finding a <b>program sponsor</b>. Internal partners include HR, legal, security, marketing, risk management and IT. Learn how others treat personal information, understand their business use, help build privacy requirements into their projects, offer solutions that help them meet objectives, and invite them into a privacy advocate group.</p><p><b>2.3.2 Privacy workshop for stakeholders.</b> Run regular workshops with the program sponsor to level the playing field: define privacy for the organization, explain market expectations, answer questions and reduce confusion. This also supports PbD and identifying projects that trigger a DPIA.</p><p><b>2.3.3 Keep a record of ownership.</b> Key stakeholders may form a steering committee; record decisions in a structured way. That documentation supports audits and the accountability requirements of privacy laws.</p><p><b>2.4 Why a framework.</b> A framework helps achieve material compliance across in-scope laws, serves as a competitive advantage by building trust, and supports business commitments to stakeholders. Strategy and framework selection can run in parallel.</p><div class='trap'><b>Exam trap:</b> the first move in building support is one-on-one conversations with senior leaders, not a company-wide email or a policy launch.</div>`},{t:'Frameworks',m:7,h:'Principles, standards, laws and programs',b:`<p>The term <b>framework</b> is used broadly for processes, templates, tools, laws and standards that guide the privacy professional. Two categories: (1) principles and standards, and (2) laws, regulations and programs.</p><table><tr><th>Name</th><th>What to remember</th></tr><tr><td>Fair Information Practices</td><td>Basic principles central to many frameworks and laws</td></tr><tr><td>OECD Guidelines</td><td>The most widely accepted privacy principles; with Council of Europe Convention 108, the basis for the EU Directive and GDPR</td></tr><tr><td>GAPP (AICPA/CICA)</td><td>Generally Accepted Privacy Principles for building and managing programs; the AICPA/CICA Privacy Maturity Model sits alongside</td></tr><tr><td>CSA Privacy Code</td><td>Canadian standard (1996) that formed the basis for PIPEDA</td></tr><tr><td>APEC Privacy Framework</td><td>Enables Asia-Pacific data transfers</td></tr><tr><td>ETSI</td><td>Telecommunications standards body</td></tr><tr><td>NIST Privacy Framework</td><td>Voluntary, risk-based, sector- and law-agnostic; three parts: Core, Profiles, Tiers</td></tr><tr><td>Privacy by Design</td><td>Seven foundational principles (Cavoukian): proactive not reactive; privacy as the default setting; privacy embedded into design; full functionality (positive-sum); end-to-end security; visibility and transparency; respect for user privacy</td></tr><tr><td>GDPR, PIPEDA</td><td>Laws that act as frameworks of generic principles</td></tr><tr><td>EU-U.S. Privacy Shield</td><td>Adopted 2016; adequacy decision invalidated by the CJEU in Schrems II on 16 July 2020</td></tr><tr><td>Binding corporate rules (BCRs)</td><td>Legally binding internal rules for transfers within a corporate group; GDPR Article 47; must be approved by the competent supervisory authority, often taking years</td></tr><tr><td>HIPAA</td><td>US law with national standards for electronic health care transactions</td></tr></table><div class='trap'><b>Exam trap:</b> of the common frameworks, BCRs are legally binding; GAPP, APEC and OECD are not. Privacy Shield is no longer a valid transfer mechanism.</div>`},{t:'Rationalizing requirements',m:5,h:'One approach for many laws',b:`<p>To <b>rationalize requirements</b> means implementing a solution that materially addresses many laws at once. It works because most privacy laws share obligations and rights: notice, choice, consent, purpose limitation, limits on retention, access, correction and deletion rights, and safeguarding data.</p><p>Requirements that fall outside the common ground are called <b>outliers</b>. They arise when local law exceeds national law or when industry or data-specific rules apply, and they are handled case by case.</p><p>Example: access requests. Set a standard process that meets the demands of many countries, plus a local process that meets the stricter time frames in countries where they exist. Another common approach, when possible, is to <b>apply the strictest standard</b> across the organization, as long as it does not violate any privacy law, exceed budget or contradict goals: answer all access requests globally within the GDPR-compliant time frame, shred everything instead of sorting, or encrypt all laptops instead of only some.</p><div class='trap'><b>Exam trap:</b> rationalizing does not mean dropping some laws as redundant. It means finding overlaps for a common solution and managing outliers separately.</div>`},{t:'Tools and governance models',m:7,h:'Tech vendors and how to structure governance',b:`<p><b>Privacy technology vendors</b> support program management: due diligence and risk assessments, consent management, data subject access requests, data mapping, incident response, website scanning and cookie compliance. Enterprise services include activity monitoring, data discovery, de-identification and pseudonymization, and enterprise communications. <b>GRC tools</b> (governance, risk and compliance) span privacy, HR, IT, compliance and the C-suite to create and distribute policies and controls, assess whether controls work and ease risk assessment. The key warning: a product by itself is not compliant. It assists when deployed as part of a properly thought-out program.</p><p><b>Governance models (2.7.1).</b> The positioning of the privacy team depends on the authority it will receive. Under legal is different from under IT. Executive leadership support has a direct impact on success. Whichever model you pick, the key tasks are: involve senior leadership, involve stakeholders, develop internal partnerships, provide flexibility, leverage communications, and leverage collaboration.</p><ul><li><b>Centralized:</b> one team or person (often the CPO or corporate privacy office) is responsible; direction flows from a single source. Efficient and consistent, but local groups must seek approval.</li><li><b>Local (decentralized):</b> decision-making delegated to lower levels, fewer tiers, wider span of control. People closest to problems solve them, but processes may be duplicated.</li><li><b>Hybrid:</b> a main individual or department issues policies and directives; local entities carry them out. Regional privacy managers or DPOs may report to local management and to the global CPO. Core values are set centrally, with flexibility locally.</li></ul><div class='trap'><b>Exam trap:</b> the first step in creating a governance model is to involve senior leadership.</div>`},{t:'Roles and reporting',m:6,h:'Who is on the privacy team',b:`<p>Know these roles for large and small organizations (2.8):</p><table><tr><th>Role</th><th>What it is</th></tr><tr><td>Chief privacy officer (CPO)</td><td>Corporate leader who develops the privacy strategy and operationalizes the program; common in large global organizations; may not report directly to the executive committee</td></tr><tr><td>Privacy director or manager</td><td>Mid-level; usually reports to the CPO; helps implement the strategy and program; may cover a subset of the business</td></tr><tr><td>Privacy analyst</td><td>Entry-level; tactical tasks such as research and helping customer support with privacy inquiries</td></tr><tr><td>Business line privacy leaders</td><td>Senior management in multinationals with multiple business lines, brands or siloed regions</td></tr><tr><td>Privacy and legal counsel</td><td>Legal support for due diligence, DPAs in contracts, breaches, notifications and complaints; may sit in privacy, legal or external counsel</td></tr><tr><td>First responders</td><td>Roles supporting a specific privacy process, such as incident response team members</td></tr><tr><td>Data protection officer (DPO)</td><td>Often required where the GDPR Article 37 applies; increasingly assigned even without a legal need; often not full time and may be outsourced</td></tr><tr><td>Privacy engineers</td><td>Technical implementation of privacy requirements in product design; leading PbD</td></tr><tr><td>Privacy technologists</td><td>Umbrella term for technology professionals who protect privacy in or with technology (audit, risk, data architects, developers and others)</td></tr></table><p>Most of these roles do not necessarily sit within the central privacy office. Organizations can use one of several structures or switch from one to another, and a hybrid mix of centralized and decentralized management lets a global organization keep common missions, values and goals.</p><div class='trap'><b>Exam trap:</b> a DPO is not automatically a CPO. The DPO title is tied to legal requirements such as GDPR Article 37, but is increasingly used anyway.</div>`}],quiz:[{q:`Which statement about a privacy mission statement is correct?`,o:[`It should be a long legal document`,`It should take under 30 seconds to read and describe the purpose of the privacy function in a few short sentences`,`It must name every law that applies`,`It is owned only by the IT department`],a:1,e:`Step 1: short, aligned to business objectives, reviewed and approved by executive leadership.`},{q:`What is the correct order for defining program scope?`,o:[`Identify applicable laws, then identify the personal information`,`Identify the personal information collected and processed, then identify in-scope laws and regulations`,`Select a framework, then identify any data`,`Appoint a DPO, then write the policies`],a:1,e:`Step 2: data first, laws second.`},{q:`Your organization will operate in a country with inadequate data protection law. What is the best practice?`,o:[`Apply only the local minimum`,`Collect less data but keep local policies`,`Apply your organization's requirements at the highest level achievable, using the most restrictive policies`,`Wait until local law is passed`],a:2,e:`Step 2: do not reduce policies to the level of the country.`},{q:`What is the main purpose of a privacy workshop for stakeholders?`,o:[`To assign blame for past incidents`,`To level the playing field by defining privacy for the organization and explaining market expectations`,`To select a privacy technology vendor`,`To approve the privacy budget`],a:1,e:`Step 3: stakeholders start with different levels of understanding.`},{q:`Which is a voluntary, risk-based tool built around a core, profiles and tiers, agnostic to sector or law?`,o:[`GAPP`,`NIST Privacy Framework`,`OECD Guidelines`,`Binding corporate rules`],a:1,e:`Step 4.`},{q:`Which mechanism is a set of legally binding internal rules for transfers within a corporate group, approved by the competent supervisory authority under the GDPR?`,o:[`APEC Privacy Framework`,`Binding corporate rules`,`EU-U.S. Privacy Shield`,`GAPP`],a:1,e:`Step 4: GDPR Article 47. Privacy Shield was invalidated in Schrems II.`},{q:`You must answer data access requests under several laws with different deadlines. Which is a rationalized approach?`,o:[`Ignore laws with longer deadlines`,`Answer every request within one year`,`Handle only EU requests`,`Set a standard access process that meets many countries, plus a local process for stricter time frames`],a:3,e:`Step 5: standard process plus local process for outliers, or apply the strictest standard when legal, affordable and consistent with goals.`},{q:`Which statement about privacy technology and GRC tools is correct?`,o:[`Buying a data-mapping tool makes the organization compliant`,`A product by itself is not compliant; it assists when deployed in a well-thought-out program`,`GRC tools replace the privacy team`,`These tools only handle cookie scanning`],a:1,e:`Step 6.`},{q:`A multinational has a global head of privacy who issues policies; regional DPOs carry them out and report locally and to the global CPO. Which governance model is this?`,o:[`Centralized`,`Local`,`Hybrid`,`None of the above`],a:2,e:`Step 6: hybrid combines central policy with local implementation.`},{q:`Whichever governance model is chosen, which is one of the key tasks?`,o:[`Keep the model confidential to avoid resistance`,`Avoid flexibility`,`Limit communication to the privacy team`,`Involve senior leadership`],a:3,e:`Step 6: involve senior leadership, involve stakeholders, develop internal partnerships, provide flexibility, leverage communications and collaboration.`},{q:`Which role is mid-level, usually reports to the CPO and assists with implementing the privacy strategy or program?`,o:[`Privacy analyst`,`First responder`,`Privacy engineer`,`Privacy director or manager`],a:3,e:`Step 7.`}],ptr:`<div class='trap'><b>Test bank pointers (your own PDF).</b> Try <b>Question 35</b> (mission statement), <b>Question 37</b> (first step creating a governance model), <b>Question 41</b> (rationalizing requirements), <b>Question 12</b> (legally binding frameworks) and <b>Question 21</b> (guidance beyond legal requirements). Check <b>Question 117</b> too: the chapter wording points to the privacy vision and mission statement as the groundwork, but the PDF key shows a different answer. Go with the book wording and treat that item as unreliable.</div>`});</script></body></html>
