<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>CIPM Day 5</title></head><body><script src='app.js'></script><script>const PL="background:#e8f3ec;border-left:4px solid #2f7d5b;padding:10px 14px;margin:12px 0;border-radius:6px";const EX="background:#eef1fb;border-left:4px solid #4c63b6;padding:10px 14px;margin:12px 0;border-radius:6px";const SC="<div style='background:#f4f1ea;padding:8px 12px;border-radius:6px;font-weight:400;font-size:.9rem;margin-bottom:6px'><i>Cedar Telehealth runs a video-consultation app and a new patient portal. It holds health records in the cloud, has developers and finance staff with system access, and is retiring some old servers.</i></div>";CIPM.day({n:5,ch:'CHAPTER 5',title:'Protect:<br>building privacy into the system',intro:`Chapter 5 is the Protect phase: how personal information is protected through privacy by design, information security, access control and technical controls. We follow a made-up telehealth company, Cedar Telehealth. Six steps, about 5 to 7 minutes each. Note: I could not pull the full text of section 5.4.3 (types of security controls, such as preventive, detective and corrective) or the threat list, so read those in your own book.`,steps:[{t:'Privacy by Design',m:6,h:'The seven principles',b:`<div style='${PL}'><b>In plain words:</b> Privacy by Design (PbD) means building privacy into a product from the first sketch, not bolting it on afterward. It was developed by Ann Cavoukian, former Ontario information and privacy commissioner, from the mid-1990s.</div><p>Know the seven foundational principles and what each means:</p><ol><li><b>Proactive, not reactive; preventative, not remedial:</b> anticipate and prevent privacy-invasive events before they happen.</li><li><b>Privacy as the default:</b> individuals do not need to act to protect their privacy. It is built in.</li><li><b>Privacy embedded into design:</b> privacy is part of the core functionality, at every stage of product development.</li><li><b>Full functionality, positive-sum not zero-sum:</b> accommodate all legitimate interests rather than trading one off against another.</li><li><b>End-to-end security, full life cycle protection:</b> strong security from start to finish of the data's life cycle.</li><li><b>Visibility and transparency:</b> parts and operations stay visible to users and providers, which builds accountability and trust.</li><li><b>Respect for user privacy:</b> keep the individual's interests uppermost, with strong defaults, appropriate notice and user-friendly options.</li></ol><div style='${EX}'><b>Example:</b> Cedar's patient portal launches with visit notes visible only to the patient and their doctor. Nobody has to switch a setting. That is principle 2, privacy as the default.</div><p>The PbD paradigm lines privacy and security controls up with the organization's risk tolerance, regulatory compliance and privacy-minded culture. The book is clear that it is <b>not</b> a formal security or privacy engineering process such as an SDLC. Its qualities include being proactive (controls are part of the engineering requirements, tested and monitored continuously), embedding privacy controls into systems and applications, and demonstrating respect for users (privacy and security controls coexist transparently without unnecessary trade-offs).</p><p><b>PbD and privacy engineering:</b> if PbD provides the <b>what</b> to do, privacy engineering provides the <b>how</b>. Privacy engineering gives a methodology and technical tools based on industry guidelines and best practices.</p><div class='trap'><b>Exam trap:</b> PbD is not a development life cycle. It is a set of principles. Privacy engineering is the practice that implements them.</div>`},{t:'GDPR design and default',m:6,h:'Article 25 and data flow diagrams',b:`<div style='${PL}'><b>In plain words:</b> the GDPR turned privacy by design from good practice into a legal duty, for systems that process data in the EU or data collected there.</div><p><b>Article 25, data protection by design and by default:</b></p><ul><li><b>By design:</b> the controller implements appropriate technical and organizational measures, such as pseudonymization, both when deciding the means of processing and during processing. The measures should put principles such as data minimization into effect, taking into account the state of the art, cost, and the nature, scope, context and purposes of processing and the risks.</li><li><b>By default:</b> only personal data necessary for each specific purpose is processed. This covers the amount collected, the extent of processing, the storage period and accessibility. By default, data must not be made accessible without the individual's intervention to an indefinite number of people.</li><li>An approved certification mechanism under Article 42 may help demonstrate compliance.</li></ul><p>Recital 78 adds examples such as minimizing processing, pseudonymizing as soon as possible, transparency about functions and processing, and letting the data subject monitor processing.</p><p><b>GDPR principles (the book's list):</b> lawfulness, fairness and transparency; purpose limitation (with a compatibility test for further processing); data minimization; accuracy; storage limitation; integrity and confidentiality (security); accountability.</p><p><b>Diagramming PbD (5.3):</b> use the data inventory to draw high-level data flow diagrams. First show the actors: administrators and end users, first- and third-party processors, and geographic locations. Then add the data flows. Then work through likely, less likely and edge-case risks (harms, threats, vulnerabilities) and decide which privacy and security controls are warranted or what must change in the design.</p><div style='${EX}'><b>Example:</b> Cedar draws patient, doctor, cloud host, payment processor and a support team in another country. It then adds arrows for the data between them, and flags that the support team can see full records, which prompts a design change to show them only what they need.</div>`},{t:'Information security',m:6,h:'CIA and risk',b:`<div style='${PL}'><b>In plain words:</b> information security keeps data secret (confidentiality), correct (integrity) and usable (availability).</div><ul><li><b>Confidentiality:</b> prevention of unauthorized disclosure.</li><li><b>Integrity:</b> information is protected from unauthorized or unintentional alteration, modification or deletion.</li><li><b>Availability:</b> information is readily accessible to authorized users.</li><li><b>Accountability</b> (security sense): entity ownership is traceable. <b>Assurance:</b> the other four objectives are met.</li></ul><p>Information security applies throughout the data life cycle, from creation or collection to destruction. It defines <b>risk</b> as the combination of the probability of an event and its consequence (ISO/IEC 73). It builds on risk management: identify risk; select and implement controls and measures to mitigate it; track and evaluate the risk to validate the first two parts. Risks should be understood and prioritized before they are addressed.</p><p>Today's risk list includes cloud-based threats (vulnerabilities, incomplete data deletion, misconfigured storage, diminished visibility and control) and insider threats, among others. The best-known standards families come from ISO and NIST:</p><ul><li><b>ISO/IEC 27001:</b> requirements for an information security management system (ISMS), a systematic approach to managing sensitive information using people, processes, IT and risk management.</li><li><b>ISO/IEC 27002:</b> code of practice and guidance on selecting and managing controls.</li><li><b>ISO/IEC 27701:</b> extension to 27001 and 27002 for a privacy information management system.</li><li><b>ISO/IEC 29100:</b> privacy framework. <b>29134:</b> PIA guidelines. <b>29151:</b> code of practice for PII protection.</li><li><b>NIST SP 800-53:</b> catalog of security and privacy controls. <b>800-30:</b> risk assessments. <b>800-37:</b> Risk Management Framework.</li></ul><div style='${EX}'><b>Example:</b> A ransomware attack locks Cedar's appointment system for a day. That is first an availability failure. If the attackers also copy records, confidentiality fails too.</div>`},{t:'Privacy vs security',m:6,h:'Where they overlap and where they do not',b:`<div style='${PL}'><b>In plain words:</b> privacy and security are partners, not twins. You can have security without privacy, but you cannot have privacy without security.</div><p><b>Overlaps:</b> both are data protection regimes. Security integrity matches privacy accuracy. Security availability supports privacy access. Both require owners and custodians to be accountable. Confidentiality supports privacy when data is both personal and nonpublic.</p><p><b>Three disconnects:</b> (1) privacy has a wider set of obligations than confidentiality, integrity and availability, such as collection limitation, openness, relevancy and use limitation; (2) personal information is not always confidential (think of a phone book), and if data is not seen as confidential it may not get the protection it needs; (3) security tools can become privacy-enhancing technologies, but they can turn invasive if applied incorrectly.</p><p><b>Classification differs too.</b> Privacy classifies personal information as personal, sensitive personal, or nonpersonal. Security classifies by confidentiality: public, confidential, highly confidential, restricted.</p><p>The two teams should align on: breach and incident response plans, training and awareness, vendor due diligence, privacy impact assessments, certification frameworks, and data mapping and inventory. Ways to work together: <b>teaming</b> (work with security and development teams to evaluate controls, train colleagues), <b>do not reinvent</b> (use existing reviews such as SOC 1 and SOC 2 audits, pen tests and ISO certifications), <b>layer in</b> (do not become a silo), <b>stay aware</b> (include relevant security risks in your privacy risk framework), and <b>rank and prioritize</b> risks.</p><div style='${EX}'><b>Example:</b> Cedar's security team already runs a yearly SOC 2 review of its cloud host. The privacy manager reuses that report in the vendor assessment instead of sending a new questionnaire.</div>`},{t:'Access and classification',m:6,h:'Who can see what',b:`<div style='${PL}'><b>In plain words:</b> give each person the smallest access they need for the job, and keep a trail of who has it.</div><p><b>Role-based access control (RBAC) principles:</b></p><ul><li><b>Segregation of duties:</b> one person cannot exploit or gain access to information inappropriately.</li><li><b>Least privilege:</b> access at the lowest level needed to do the function.</li><li><b>Need-to-know:</b> access only to information critical to the assigned mission.</li></ul><p><b>User access management guidelines:</b> unique user IDs (no shared admin accounts); credentials such as smart card, password, two-factor authentication or machine certificate; level of access based on business purpose; formal process for granting and removing access; regular password changes; regular review of access rights, especially privileged accounts, job changes and terminations; user training on security responsibilities; strong password practice; and a clean desk policy for papers and removable media.</p><p><b>Security classification:</b> public (no impact); confidential (impact isolated within the organization and/or moderate risk to individuals); highly confidential (impact to multiple parts of the organization and/or significant risk to individuals); restricted (enterprise-wide impact and/or severe risk to individuals).</p><p><b>Privacy classification by identifiability and linkability (Table 5-1):</b></p><ul><li><b>Identified, linked:</b> unique identifiers across databases; contact information stored with profile information.</li><li><b>Pseudonymous, linkable with reasonable and automatable effort:</b> no unique identifiers across databases but common attributes; contact information stored separately from profile or transaction data.</li><li><b>Anonymous, unlinkable:</b> no contact information, no long-term personal characteristics, for example k-anonymity with a large k.</li></ul><div style='${EX}'><b>Example:</b> A Cedar developer who maintains the scheduling module should not have access to patient notes. That is least privilege. A finance clerk who can both create a supplier and approve its payments breaks segregation of duties.</div>`},{t:'Controls and destruction',m:6,h:'Policy controls, technical controls, deleting data',b:`<div style='${PL}'><b>In plain words:</b> policy says what must happen. Technical controls make it happen. And data must be destroyed properly when it is no longer needed.</div><p><b>Policy controls come from four places (Table 5-2):</b></p><ul><li><b>Laws and regulations:</b> for example, the GDPR right to erasure means a delete button that actually deletes.</li><li><b>Self-regulatory regimes:</b> for example, PCI DSS requires encrypting cardholder data.</li><li><b>Industry practices:</b> for example, GAPP calls for explicit consent for sensitive data (opt-in).</li><li><b>Corporate ethos or policy:</b> the company's own principles.</li></ul><p><b>Technical controls fall into four areas:</b></p><ul><li><b>Obfuscation:</b> making data obscure or unintelligible, such as masking, tokenization, randomization, noise and hashing.</li><li><b>Data minimization:</b> collecting only what is directly relevant and necessary, such as granulation, data segregation, deletion, de-identification and aggregation.</li><li><b>Security:</b> preventing unauthorized access, such as encryption, access controls, data loss management, destruction, auditing and testing.</li><li><b>Privacy-enhancing technologies (PETs):</b> technology that engineers acceptable privacy, such as secure multiparty computation, homomorphic encryption, differential privacy, mix networks and anonymous digital credentials.</li></ul><p><b>Data destruction:</b> destroy personal information when no longer needed, with a policy and guidance, working with data retention functions. Electronic destruction: <b>overwriting and degaussing</b>. Physical destruction: <b>shredding, melting and burning</b>. Be precise: a <b>hard delete</b> is not a <b>soft delete</b>, and backups, cached and nonvolatile data must be included in the instructions.</p><div style='${EX}'><b>Example:</b> Cedar retires old servers. Its policy says drives must be overwritten or degaussed, then physically shredded, and that backup copies are handled in the same process.</div>`}],quiz:[{q:SC+`The new Cedar portal keeps visit notes private to the patient and doctor without the patient changing any setting. Which PbD principle does this best show?`,o:[`Proactive, not reactive`,`Privacy as the default`,`Full functionality`,`Visibility and transparency`],a:1,e:`Step 1: privacy as the default means no action is required from the individual.`},{q:`Which statement best distinguishes privacy by design from privacy engineering?`,o:[`PbD is a formal software development life cycle, and privacy engineering is a legal duty`,`Privacy engineering sets principles, and PbD supplies the tools`,`They are two names for the same concept`,`PbD provides the what to do, and privacy engineering provides the how to do it`],a:3,e:`Step 1: the book states that PbD is not a formal SDLC.`},{q:SC+`Which of the following does GDPR Article 25 'by default' cover?`,o:[`Limiting amount collected, extent of processing, storage period and accessibility to what each purpose needs`,`Encrypting every data set in the organization`,`Appointing a data protection officer for each system`,`Publishing every data flow diagram to patients`],a:0,e:`Step 2: by default, only data necessary for each specific purpose is processed.`},{q:SC+`Cedar wants to apply PbD using its data inventory. Which approach does the book describe?`,o:[`Write the privacy notice first, then draw the system`,`Add risks first, then decide which actors exist`,`Draw actors and locations, add the data flows, then work through risks and the controls they need`,`Interview users first and skip any diagrams`],a:2,e:`Step 2: actors, then data flows, then risks and controls or design changes.`},{q:`Which information security objective ensures information is protected from unauthorized or unintentional alteration, modification or deletion?`,o:[`Confidentiality`,`Integrity`,`Availability`,`Assurance`],a:1,e:`Step 3: integrity. Confidentiality prevents unauthorized disclosure; availability means readily accessible to authorized users.`},{q:`How does the book describe risk in information security?`,o:[`The cost of a security tool`,`The number of staff with access`,`The size of the data set`,`The combination of the probability of an event and its consequence`],a:3,e:`Step 3: risk management identifies risk, applies controls and measures, then tracks and evaluates them.`},{q:`Which statement about privacy and information security is TRUE?`,o:[`You can have privacy without security`,`Personal information is always confidential`,`You can have security without privacy, but not privacy without security`,`Security classification and privacy classification are identical`],a:2,e:`Step 4: personal information is not always nonpublic, and privacy has wider obligations than CIA.`},{q:`Which of the following is NOT an area where the book says privacy and information security should align?`,o:[`Breach and incident response plans`,`Vendor due diligence`,`Training and awareness`,`Choosing the company's advertising slogans`],a:3,e:`Step 4: alignment areas include incident response, training, vendor due diligence, PIAs, certification frameworks and data mapping.`},{q:SC+`At Cedar, one finance employee can create a new supplier account and also approve payments to it. Which access control principle is being broken?`,o:[`Segregation of duties`,`Clean desk policy`,`Password rotation`,`Unique user IDs`],a:0,e:`Step 5: segregation of duties stops one person from exploiting or gaining access inappropriately.`},{q:SC+`Cedar stores patient contact details separately from visit records. There are no unique identifiers across databases, but the data can be linked with reasonable and automatable effort. How is this classified?`,o:[`Identified`,`Anonymous`,`Pseudonymous`,`Public`],a:2,e:`Step 5: pseudonymous means linkable with reasonable and automatable effort; anonymous means unlinkable.`},{q:`Which of the following is a technical control in the obfuscation category?`,o:[`Encrypting a database`,`Masking or tokenizing personal data`,`Differential privacy`,`Deleting records after retention ends`],a:1,e:`Step 6: obfuscation covers masking, tokenization, randomization, noise and hashing. Encryption is security, differential privacy is a PET, and deletion is minimization.`},{q:SC+`Cedar is retiring old servers. Which pair are the electronic methods of destroying data named in the book?`,o:[`Overwriting and degaussing`,`Shredding and melting`,`Burning and overwriting`,`Degaussing and melting`],a:0,e:`Step 6: shredding, melting and burning are physical methods. Also remember hard versus soft delete and backups.`}],ptr:`<div class='trap'><b>Test bank pointers (your own PDF).</b> For this chapter try <b>Questions 57, 105 and 111</b>. Do them in the PDF, then tell your coach each answer and how sure you were. Remember: if the book and the PDF key disagree, trust the book and note the question number.</div>`});</script></body></html>
