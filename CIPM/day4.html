<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>CIPM Day 4</title></head><body><script src='app.js'></script><script>const PL="background:#e8f3ec;border-left:4px solid #2f7d5b;padding:10px 14px;margin:12px 0;border-radius:6px";const EX="background:#eef1fb;border-left:4px solid #4c63b6;padding:10px 14px;margin:12px 0;border-radius:6px";const SC="<div style='background:#f4f1ea;padding:8px 12px;border-radius:6px;font-weight:400;font-size:.9rem;margin-bottom:6px'><i>Summit Fitness runs gyms and a membership app in several countries, including EU member states. It is about to acquire a smaller gym chain, move member records to a cloud CRM vendor, and launch a heart-rate tracking feature.</i></div>";CIPM.day({n:4,ch:'CHAPTER 4',title:'Assess:<br>know your data and your risks',intro:`Chapter 4 is the first operational chapter: Assess, the first phase of the privacy operational life cycle. This is where the exam starts to feel like real work. We follow a made-up company, Summit Fitness, through inventories, records of processing, impact assessments, vendors and an acquisition. Six steps, about 5 minutes each. Note: this lesson covers sections 4.1 to 4.4 and 4.6 to 4.8. Read sections 4.4 (the DPIA detail), 4.5 (physical and environmental assessments) and the AI assessments part in your own book, because I could not pull their full text.`,steps:[{t:'Data governance',m:5,h:'Who is in charge of the data?',b:`<div style='${PL}'><b>In plain words:</b> you cannot protect data nobody owns. Data governance decides who plans, oversees and controls how data is managed and used.</div><p>The book uses the DAMA International definition: data governance is the <b>planning, oversight and control</b> over management of data and the use of data. A data governance framework gives the organization a holistic approach to collecting, managing, securing and storing data. DAMA pictures a wheel with governance at the hub and ten knowledge areas around it: data architecture; data modeling and design; data storage and operations; data security; data integration and interoperability; documents and content; reference and master data; data warehousing and business intelligence; metadata; data quality.</p><p>Three levels of roles, which the exam likes:</p><ul><li><b>Strategic: data steering committee.</b> C-level people who steer and approve the data strategy, governance and data policies.</li><li><b>Managerial: data owners.</b> Business or function leads responsible for a data domain or data asset.</li><li><b>Operational: data stewards.</b> Subject matter experts accountable for the day-to-day management of data and for explaining what the information means and how it is used.</li></ul><div style='${EX}'><b>Example:</b> At Summit Fitness, the CFO sits on the steering committee. The head of memberships is the data owner for member data. The analyst who keeps member records clean is the data steward.</div><p>Not every organization has a data governance function, so the privacy professional should build partnerships with the people accountable for data, help build inventories and show Article 30 compliance. Privacy assessments also fit the <b>Three Lines Model</b>: the privacy or compliance function (second line) checks them, and internal audit (third line) reviews them after rollout.</p><p>Why assess at all? Finding a problem early is simpler and cheaper to fix, assessments can reduce a project's ongoing cost by minimizing the data collected, and they improve transparency and accountability.</p>`},{t:'Data inventory',m:5,h:'Where does the personal data live?',b:`<div style='${PL}'><b>In plain words:</b> a data inventory (also called a data map) is a list of what personal data you hold, where it is, how it moves and who touches it.</div><p>The book says the inventory shows where data resides, how it is shared and organized, and where it is physically located. It helps identify risks to reputation and compliance, and if something goes wrong, penalties are likely to be less severe when you have an established system for recording and organizing the inventory. It also feeds the Article 30 records of processing.</p><p><b>Who owns it?</b> Normally the privacy function and/or IT, always with input from every business function that owns or decides about the data. Many organizations now have a data governance team that owns inventories, and the budget is often shared.</p><p><b>What goes in it (Table 4-1):</b></p><ul><li>Purpose and nature of the repository, and its owner.</li><li>The legal entity doing the processing (shows who is controller or processor).</li><li>Volume, including how much is sensitive.</li><li>Format: paper or electronic, structured or unstructured.</li><li>How the information is used, and how long it is kept (does it follow the retention schedule?).</li><li>Types of information: addresses, government IDs, health, salary and so on.</li><li>Where it is stored and where it is accessed (countries and systems), and who has access.</li><li>International transfers, who it is shared with (controllers or processors), and which transfer mechanism covers it.</li></ul><div style='${EX}'><b>Example:</b> Summit's inventory shows member data in the app database (structured, electronic), signed paper waivers in a filing room, and a cloud CRM in another country. The waivers are a repository the team would otherwise forget.</div><p>Building it by hand takes a lot of time and may miss processing, so consider a tool such as GRC software or a data-mapping tool. Pick the one that is easiest to update. The privacy professional may also keep an inventory of applicable laws and run a <b>gap analysis</b> against them, involving the legal team.</p>`},{t:'Records of processing',m:6,h:'GDPR Article 30 in practice',b:`<div style='${PL}'><b>In plain words:</b> Article 30 makes controllers and processors write down what they do with personal data, so they can show a regulator on request.</div><p>Records of processing activities (RoPA) must include: names and contact details of the controller or processor, DPO and representative where applicable; joint controllers; purposes (controllers); categories of personal data and data subjects (controllers) or categories of processing (processors); categories of recipients (controllers); international transfers and safeguards for exceptional transfers; retention periods where possible; and a general description of technical and organizational security measures.</p><p>The record must be disclosed to a DPA <b>on request</b>. The <b>only exemption</b>: fewer than 250 employees, <b>and</b> processing that is occasional, includes no sensitive data, and is not likely to risk individuals' rights and freedoms (profiling counts as a risk). All the conditions must hold.</p><p>To meet it, run and maintain a <b>data flow analysis report</b> showing categories of personal data, purposes, recipients and how data flows internally and externally.</p><p><b>How to start the inventory project, in order:</b> the DPO first identifies the controllers and processors (finance or the company secretary can help work out legal entities). Then interview data owners, or functional leads if owners are unclear. Useful people: digital marketing (what they gather), corporate counsel (litigation holds), IT database administrators (schemas), backup and continuity teams (what is retained), the software team (list of software), compliance, and whoever answers data subject access requests. Identify nonpersonal and anonymous data too, since it is outside the GDPR. New systems must document the personal data they process so the inventory does not go stale. Also learn the security used, retention, access, disclosure and legal basis.</p><div style='${EX}'><b>Example:</b> Summit's marketing team tells the DPO that the app shares workout data with an analytics vendor. That vendor was missing from the inventory, so it now goes into the records.</div><div class='trap'><b>Exam trap:</b> the 250-employee exemption is not enough alone. Occasional processing, no sensitive data and no likely risk must also be true.</div>`},{t:'Assessments and PIAs',m:7,h:'Privacy assessment, PIA and DPIA',b:`<div style='${PL}'><b>In plain words:</b> three tools, three jobs. A privacy assessment checks whether you comply. A PIA checks the risk of a specific project. A DPIA is the GDPR's formal version for high-risk processing.</div><ul><li><b>Privacy assessment (measuring compliance):</b> measures compliance with laws, regulations, adopted standards and internal policies. Scope can include training, monitoring the regulatory environment, data, systems and process assessments, risk assessments, incident response, contracts, remediation and audits. Can be done internally (audit, DPO, a business function) or externally by a third party, on a schedule or in response to an event or a regulator's request. Standards can be subjective (interviews) or objective (system logs).</li><li><b>Privacy impact assessment (PIA):</b> an analysis of the privacy risks of processing personal information in a project, product or service. To be effective it also suggests mitigations. It supports privacy by design.</li><li><b>Data protection impact assessment (DPIA):</b> the GDPR assessment for processing likely to result in a high risk. Under Article 35 a DPIA includes at least a systematic description of the processing and its purposes, an assessment of necessity and proportionality, an assessment of risks to individuals, and the measures to address those risks.</li></ul><p><b>When to do a PIA:</b> early, at the ideation or scoping stage; when standards, policies or laws change; and when you create new privacy risks by changing how personal information is handled. Examples of triggers: converting paper records to electronic, merging or matching multiple databases, applying user authentication to a public system, significant new uses or new technology, retiring a system that held personal data, adding data from commercial or public sources, alterations that add new collection, use or disclosure, adding qualitatively new types of data, and using third-party service providers.</p><div style='${EX}'><b>Example:</b> Summit's heart-rate feature adds a new type of data and new technology. The PIA should start when the feature is being scoped, not after launch.</div><p><b>Prioritizing:</b> many organizations first run an <b>express PIA</b>, a short questionnaire that decides whether a full PIA is needed. In the US, the E-Government Act of 2002 required agencies to do PIAs for IT systems with public PII, preceded by a <b>privacy threshold analysis (PTA)</b> to decide if a PIA is needed.</p><p><b>Other facts:</b> transfer impact assessments after Schrems II are in essence PIAs. Brazil's LGPD uses an impact report (RIPD). China's Personal Information Security Specification expects a security impact assessment at least once a year, and PIPL requires a risk assessment before some activities. Virginia's Consumer Data Protection Act requires data protection assessments. <b>ISO 29134</b> gives guidelines for running a PIA and structuring the report; it is guidelines, not a standard, and says the PIA should start at the earliest design phase and continue after implementation.</p><div class='trap'><b>Exam trap:</b> a PIA is about a project or product's risk. A privacy assessment is about compliance with rules. Do not swap them.</div>`},{t:'Assessing vendors',m:7,h:'Trust, but check the vendor',b:`<div style='${PL}'><b>In plain words:</b> when a vendor handles your customers' data, you are still responsible. Check them before you sign, write the rules into the contract, and keep checking.</div><p><b>Contract points to consider:</b> the type of personal information the vendor can access; the vendor's plans to protect it; responsibilities if there is a breach; disposal of data at termination; limits so data is used only for specified purposes; audit and investigation rights; liability for a breach. Write privacy protections into the statement of work and map them to service-level agreements. Set up the process with procurement and the business owners. Small vendors may need help, such as training or security engineering support.</p><p><b>Cloud models:</b></p><ul><li><b>IaaS:</b> supplier gives remote use of computing resources; you manage the platform and all applications.</li><li><b>PaaS:</b> supplier gives the platform and hardware; you manage applications.</li><li><b>SaaS:</b> supplier provides infrastructure, platform and application.</li></ul><p>Cloud customers often cannot negotiate terms and cannot inspect premises. Areas to check: certifications and standards (such as ISO 27001), data location and jurisdiction, encryption in transit and at rest, breach notification processes, auditable access, security audit reports, long subcontractor chains, and data policies including backup and portability.</p><p><b>GDPR Article 28:</b> the controller may use only processors that give <b>sufficient guarantees</b> of appropriate technical and organizational measures. That means proof of competence, such as third-party assessment or certification, before and after the contract, with audit where appropriate. If the controller cannot establish proof, it must walk away, or it is in automatic breach. The processor acts only on the controller's instructions; if it steps outside them it risks being treated as a controller. The processor must also assist with compliance, including breach notification.</p><p><b>CCPA:</b> a vendor that is a service provider needs a written contract limiting processing to the business purpose. Third parties are vendors with their own uses for the data, so read the master services agreement. Do not accept claims that data is anonymized or aggregated at face value; check the vendor meets the CCPA definitions.</p><div style='${EX}'><b>Example:</b> Summit's cloud CRM vendor says it only uses anonymized data. Summit's privacy manager asks for proof that this meets the CCPA definitions and reads the contract for the vendor's own-use rights.</div>`},{t:'Mergers and divestitures',m:5,h:'Buying or selling a business',b:`<div style='${PL}'><b>In plain words:</b> when you buy a company you also buy its privacy problems. Check them before you connect the systems.</div><p>Mergers form one organization from others, acquisitions mean buying one or more organizations, and divestitures mean selling a division. Merger and acquisition processes should include a <b>privacy checkpoint</b> that evaluates applicable new compliance requirements: sector-specific laws (such as HIPAA), standards (such as PCI DSS), comprehensive laws and regulations, existing client agreements, and new resources, technologies and processes that must be brought into line with privacy and security policies before integration.</p><p>If data moves to a different or additional controller: consider the sharing in due diligence; establish what data is moving and why it was originally obtained; establish your lawful basis; follow the processing principles (lawfulness, fairness, transparency); document the sharing; get technical advice where systems differ; and consider when and how to inform data subjects, who may have a right to object. After the change, check records are accurate, document what you do, apply a consistent retention policy and ensure security.</p><p><b>Divestitures:</b> before the deal closes, assess the infrastructure of the entity being divested to confirm no unauthorized information, including personal information, remains on your systems, except preapproved proprietary data.</p><div style='${EX}'><b>Example:</b> Before buying the smaller gym chain, Summit checks whether the chain takes card payments (PCI DSS), whether it has EU members, and what its member contracts promise about data use. Only then does Summit plan the system merge.</div>`}],quiz:[{q:SC+`Which of the following is NOT an element the book lists for a data inventory?`,o:[`Where the data is stored`,`Where the data is accessed from`,`The transfer mechanism covering international transfers`,`The vendor's annual marketing budget`],a:3,e:`Step 2: elements include storage and access locations, retention, sharing and transfer mechanisms. Marketing budgets are not listed.`},{q:SC+`Who is accountable for the day-to-day management of Summit's member data domain and acts as the subject matter expert?`,o:[`The data steward`,`The data steering committee`,`The data protection officer`,`The chief executive officer`],a:0,e:`Step 1: stewards are operational, owners are managerial, and the steering committee is strategic.`},{q:SC+`A Summit subsidiary has 120 employees. Under which condition may it avoid keeping detailed Article 30 records?`,o:[`It has appointed a data protection officer`,`It only processes data of EU employees`,`Its processing is occasional, includes no sensitive data and is unlikely to risk individuals' rights`,`It uses a cloud vendor that already keeps its own records`],a:2,e:`Step 3: fewer than 250 employees is not enough alone; all three processing conditions must hold.`},{q:SC+`The DPO starts building the data and processing inventory. What does the book suggest doing FIRST?`,o:[`Run a DPIA on every system`,`Identify the data controllers and processors among the legal entities`,`Draft the external privacy notice`,`Appoint data stewards for each department`],a:1,e:`Step 3: identify controllers and processors first, then interview data owners or functional leads.`},{q:SC+`When should the PIA for the heart-rate tracking feature begin?`,o:[`After launch, once real user data exists`,`After the first internal audit`,`At the ideation or scoping stage of the feature`,`Only if a regulator asks for it`],a:2,e:`Step 4: a PIA is most effective when done early.`},{q:`Which statement is TRUE about privacy assessments and PIAs?`,o:[`A privacy assessment measures compliance with laws, standards and policies, while a PIA analyzes the risks of a specific project, product or service`,`A PIA measures compliance with internal policies across the whole organization`,`A privacy assessment is only ever carried out by an external third party`,`A PIA is only required after a data breach`],a:0,e:`Step 4: assessments can be internal or external; PIAs look at projects early and propose mitigations.`},{q:SC+`Which of the following is listed as a business change that may trigger a PIA?`,o:[`Redesigning the layout of a gym floor`,`Updating the logo on the app`,`Renewing the lease on a gym location`,`Converting paper member files to electronic format`],a:3,e:`Step 4: conversion of records from paper to electronic is a listed trigger. Using third-party service providers is another.`},{q:`What is an express PIA?`,o:[`A PIA that must be completed within one week`,`A short questionnaire used to decide whether a full PIA is needed`,`A PIA performed only by external consultants`,`A PIA that replaces the DPIA under the GDPR`],a:1,e:`Step 4: it helps prioritize which projects get a full PIA. The US equivalent step is a privacy threshold analysis.`},{q:SC+`Under GDPR Article 28 as the book describes it, what must Summit do if it cannot establish proof of the cloud vendor's competence?`,o:[`Walk away from the vendor`,`Sign the contract and add a liability clause`,`Rely on the vendor's marketing materials`,`Notify the supervisory authority and proceed`],a:0,e:`Step 5: sufficient guarantees need proof; without it the controller must not proceed, or it is in automatic breach.`},{q:`In which cloud model does the supplier provide the infrastructure, the platform and the application?`,o:[`Infrastructure as a service`,`Platform as a service`,`Software as a service`,`A private on-premises server`],a:2,e:`Step 5: IaaS gives computing resources only; PaaS adds the platform; SaaS includes the application.`},{q:SC+`Summit's CRM vendor claims it only uses anonymized, aggregated data. Under the CCPA discussion in the book, what should Summit do?`,o:[`Check that the vendor's practices meet the CCPA definitions of aggregate and deidentified data`,`Accept the claim because it is in writing`,`Treat the vendor as a third party in every case`,`Stop sharing data and cancel the contract automatically`],a:0,e:`Step 5: do not take such claims at face value; the definitions are specific.`},{q:SC+`Which of these should be part of the privacy checkpoint for Summit's acquisition of the smaller gym chain?`,o:[`Merging the databases immediately to save integration costs`,`Evaluating new compliance requirements, such as sector laws, standards and existing client agreements`,`Informing data subjects only after the systems are integrated`,`Skipping due diligence on data sharing because the deal is private`],a:1,e:`Step 6: evaluate requirements and bring new resources into line before integration; consider how and when to inform data subjects.`}],ptr:`<div class='trap'><b>Test bank pointers (your own PDF).</b> For this chapter try <b>Questions 11, 19, 53, 101 and 104</b>. Do them in the PDF, then tell your coach each answer and how sure you were. Remember: if the book and the PDF key disagree, trust the book and note the question number.</div>`});</script></body></html>
