<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>CIPM Day 3</title></head><body><script src='app.js'></script><script>const PL="background:#e8f3ec;border-left:4px solid #2f7d5b;padding:10px 14px;margin:12px 0;border-radius:6px";const EX="background:#eef1fb;border-left:4px solid #4c63b6;padding:10px 14px;margin:12px 0;border-radius:6px";CIPM.day({n:3,ch:'CHAPTER 3',title:'Privacy laws:<br>who must follow what',intro:`New style, based on your feedback: plain language first, then the book's exact exam term, then a short example. Follow one made-up company, Oasis Retail, a Riyadh-based online store that sells to customers in Europe, California, Brazil and China. Each step is about 5 minutes.`,steps:[{t:'Four types of law',m:4,h:'Different countries, different rulebooks',b:`<div style='${PL}'><b>In plain words:</b> not every country writes privacy law the same way. Some have one big law. Some have many small laws, one per industry. Some let industry police itself.</div><p>The book groups them into four models. Learn the name and the one-line idea:</p><ul><li><b>Comprehensive (omnibus):</b> one broad law that covers most organizations and sectors. Examples in the chapter: the GDPR and China's PIPL.</li><li><b>Sectoral:</b> separate laws for separate industries, such as health, finance and children's data. The United States federal approach is described as a <b>limited sectoral approach</b>.</li><li><b>Co-regulatory:</b> a variant of the comprehensive model where industry develops enforcement standards and a privacy agency oversees them.</li><li><b>Self-regulatory:</b> companies follow a code of practice set by industry bodies, for example trust-mark programs.</li></ul><div style='${EX}'><b>Example:</b> Oasis Retail sells to a customer in Germany and a customer in Texas. For Germany, one broad law covers the whole sale. For Texas, Oasis checks which sector rules apply: payment cards, email marketing, children's data and so on. Same company, two very different checklists.</div><p>The practical point the book makes: a privacy manager who knows the <b>common elements</b> across laws avoids repeating the same compliance work jurisdiction by jurisdiction. You already saw this idea as rationalizing requirements in Chapter 2.</p>`},{t:'GDPR',m:6,h:'The law that set the global standard',b:`<div style='${PL}'><b>In plain words:</b> the GDPR follows the data subject, not the company's address. If you target people in the EU, it can reach you even if you have no office there.</div><p>Key facts: enforceable since 25 May 2018, and its reach is <b>extraterritorial</b>. Article 3 (territorial scope) says it applies when:</p><ul><li>the controller or processor has an establishment in the EU, or</li><li>a non-EU organization offers goods or services to people in the EU (payment is not required), or</li><li>a non-EU organization monitors the behavior of people in the EU.</li></ul><div style='${EX}'><b>Example:</b> Oasis Retail has no EU office. Its app offers products to people in France and tracks their browsing there. The GDPR applies to Oasis.</div><p><b>What individuals can do:</b> withdraw consent, get a copy of their data, move their data to another organization (portability), have data deleted, object to automated decision-making including profiling.</p><p><b>What organizations must do:</b> implement privacy by design and by default; keep appropriate safeguards; notify the authority and individuals of breaches within 72 hours of detection when criteria are met (the book's wording); get appropriate consent; get a parent's consent for children under 16 (the book's wording); keep records of processing; appoint a DPO if you regularly process lots of data or sensitive data; take responsibility for vendors; run DPIAs on new or high-risk processing; put safeguards on cross-border transfers; consult regulators before certain processing; be able to demonstrate compliance; train staff.</p><p><b>What regulators can do:</b> ask for records, impose temporary processing bans, require breach notification, order erasure, suspend cross-border data flows, and fine up to <b>20 million euros or 4 percent of annual revenues</b>.</p><div class='trap'><b>Exam trap:</b> GDPR scope is about who the data subjects are and what you do with them, not where your headquarters is.</div>`},{t:'CCPA, LGPD, PIPL and US laws',m:6,h:'Other laws you must recognize',b:`<div style='${PL}'><b>In plain words:</b> after the GDPR, other places copied many of its ideas. In the US, the picture is a patchwork: a few broad state laws plus many industry laws.</div><table><tr><th>Law</th><th>Remember this</th></tr><tr><td>California Consumer Privacy Act (CCPA)</td><td>First comprehensive US privacy law. Signed June 2018, in effect 1 January 2020, Attorney General enforcement from 1 July 2020. Consumers can ask what data is held and how it is used or shared, ask for erasure, and opt out of sale. Businesses must verify identity, respond to access requests free of charge within <b>45 days</b>, offer ways to submit requests (toll-free number, web form or email), and show a <b>Do Not Sell My Personal Information</b> link.</td></tr><tr><td>Brazil LGPD</td><td>Privacy by design and default, DPO for controllers, a personal data protection impact report (RIPD), notify regulators and individuals of breaches, special rules for children's data. Sanctions: up to 2 percent of revenue, capped at 50 million reais per infraction.</td></tr><tr><td>China PIPL</td><td>Adopted 20 August 2021, effective 1 November 2021. China's first comprehensive privacy law, with GDPR-like data minimization and consent provisions.</td></tr></table><p>US sector laws, with the regulator you should link to each:</p><table><tr><th>Law</th><th>Sector or topic</th><th>Enforcer (as listed)</th></tr><tr><td>HIPAA</td><td>Health insurance and medical records</td><td>HHS Office for Civil Rights</td></tr><tr><td>HITECH Act</td><td>Health IT and electronic records</td><td>OCR</td></tr><tr><td>COPPA</td><td>Online data from children (verifiable parental consent)</td><td>FTC</td></tr><tr><td>GLBA</td><td>Financial institutions must explain information-sharing practices</td><td>FTC, banking agencies and others</td></tr><tr><td>CAN-SPAM</td><td>Unsolicited commercial email</td><td>FTC</td></tr><tr><td>FACTA</td><td>Credit transactions, identity protection</td><td>FTC and banking regulators</td></tr><tr><td>Do Not Call Registry</td><td>Choice about telemarketing calls</td><td>FTC</td></tr><tr><td>DPPA</td><td>Motor vehicle records</td><td>State attorneys general</td></tr></table><div class='trap'><b>Exam trap:</b> COPPA is about children, GLBA is about financial institutions, HIPAA is about health. Link the law to the sector and you will rarely mix them up.</div>`},{t:'Self-regulation',m:4,h:'Rules that are not laws',b:`<div style='${PL}'><b>In plain words:</b> some rules come from industry groups or contracts, not governments. You can still be forced to follow them, for example by a card brand.</div><p>Match each program to who it is for:</p><ul><li><b>PCI DSS:</b> any organization that accepts, transmits or stores cardholder data from the major card brands, regardless of size. It is an industry security standard, not a law.</li><li><b>DMA Guidelines for Ethical Business Practice:</b> people and organizations in data-driven marketing.</li><li><b>Trust marks</b> (such as TrustArc, Verisign, McAfee, PayPal): online vendors and e-commerce sites.</li><li><b>CARU advertising guidelines:</b> advertising directed to children under 12.</li><li><b>NAI Code of Conduct:</b> member companies doing interest-based advertising.</li><li><b>EU Cloud Code of Conduct:</b> business-to-business cloud services where the provider acts as a processor under GDPR Article 28.</li></ul><div style='${EX}'><b>Example:</b> Oasis Retail takes card payments on its app. No government forced it to follow PCI DSS, but the card brands require it, and a breach could cost it the ability to take cards.</div>`},{t:'Cross-border transfers',m:7,h:'Moving data across borders',b:`<div style='${PL}'><b>In plain words:</b> the EU says personal data can leave only if it stays protected. A country either proves it is safe enough, or the company adds its own protections.</div><p><b>Route 1: adequacy decision (Article 45).</b> The European Commission decides a country gives a level of protection <b>essentially equivalent</b> to the EU. Then data flows freely.</p><p><b>Route 2: appropriate safeguards (no adequacy decision).</b></p><ul><li><b>Binding corporate rules (BCRs):</b> binding policy suite for a multinational group (Articles 46b and 47).</li><li><b>Standard contractual clauses (SCCs):</b> model contracts (Article 46c).</li><li><b>Codes of conduct or certification mechanisms:</b> approved, with binding and enforceable commitments (Articles 40 and 42).</li><li><b>Ad hoc contractual clauses:</b> need authorization from the supervisory authority.</li></ul><p>After <b>Schrems II</b>, SCCs and similar tools need a <b>case-by-case assessment</b> of the receiving country. That assessment is the <b>transfer impact assessment (TIA or DTIA)</b>. Its steps, in order: map where data is and where it goes; identify the transfer mechanism; assess whether it is effective; adopt additional safeguards if needed; make sure the extra measures fit business requirements; monitor for ongoing compliance. Regulators expect you to ask questions such as how likely government access is, whether the data falls within intelligence or law enforcement activity, and what the receiving country's privacy and human rights standards look like.</p><div style='${EX}'><b>Example:</b> Oasis Retail stores its EU customers' orders on a cloud server in a country with no adequacy decision. Oasis signs SCCs with the host, then performs a TIA: where is the data, what could the government there demand, and do we need extra safeguards such as encryption?</div><p><b>Outside the EU:</b> the key ideas are transparency and <b>surprise minimization</b> (would the person be surprised or upset by where their data goes?). Organizations that transfer data stay responsible for protecting it. Rule of thumb in the book: adjust the program to the <b>most stringent</b> legal requirement that applies. Definitions such as controller, processor and sensitive data differ between countries.</p><div class='trap'><b>Exam trap:</b> the Privacy Shield was invalidated, so it is not a route. Do not pick it.</div>`},{t:'Penalties and oversight',m:6,h:'Who enforces, what they can do, and staying current',b:`<div style='${PL}'><b>In plain words:</b> every country has someone who can investigate you, but not everyone can fine you, and some places have no single regulator at all.</div><p><b>Balance (3.4):</b> compliance is the baseline. Business units should understand the privacy goals and be part of the solution. Aim for compliance with the least business disruption, because disruption is another form of penalty. Compliance is also a chance to improve data inventory and access controls.</p><p><b>Examples of oversight powers listed in the chapter:</b></p><ul><li><b>Canada (OPC):</b> investigates complaints, conducts audits, enforces court orders under federal law, issues reprimands.</li><li><b>United Kingdom (ICO):</b> fines of up to 4 percent of annual worldwide turnover or 17.5 million pounds, whichever is higher, plus investigative and corrective powers.</li><li><b>Brazil:</b> sanctions up to 2 percent of revenue, capped at 50 million reais per infraction.</li><li><b>China:</b> no single centralized enforcement mechanism; several regulators can warn, fine, revoke licenses or refer cases for criminal proceedings.</li><li><b>United States:</b> no one agency officially oversees all privacy enforcement; many federal and state agencies share it.</li></ul><p><b>Staying current (3.8 and 3.9):</b> track law changes through the internet, journals, automated online services and third-party vendors. Choose methods based on cost, requirements and industry. Small privacy offices can use third-party legal or consultancy services and automated research tools. IAPP resources such as the Daily Dashboard and Privacy Tracker are named in the chapter.</p><div class='trap'><b>Exam trap:</b> do not assume every regulator can fine. Canada's OPC, for example, is listed with investigation, audit, court-order and reprimand powers.</div>`}],quiz:[{q:`A country has one broad privacy law that covers most organizations and sectors. Which model is this?`,o:[`Sectoral`,`Self-regulatory`,`Comprehensive (omnibus)`,`Co-regulatory`],a:2,e:`Step 1: one broad law is comprehensive. Sectoral means separate laws per industry.`},{q:`Oasis Retail has no office in the EU. Its app offers products to people in France and monitors their browsing there. Does the GDPR apply?`,o:[`No, because Oasis has no EU establishment`,`Only if Oasis stores more than a million EU records`,`Only after an EU regulator approves Oasis`,`Yes, because Oasis offers goods or services to, or monitors, people in the EU`],a:3,e:`Step 2: Article 3 covers non-EU organizations that offer goods or services to, or monitor the behavior of, people in the EU.`},{q:`Which maximum penalty matches the GDPR as described in the book?`,o:[`2 percent of revenue, capped at 50 million reais`,`20 million euros or 4 percent of annual revenues`,`10,000 Singapore dollars`,`No financial penalty is possible`],a:1,e:`Step 2: the first option describes Brazil's LGPD.`},{q:`Which US law targets online collection of personal information from children and requires verifiable parental consent?`,o:[`HIPAA`,`GLBA`,`COPPA`,`CAN-SPAM`],a:2,e:`Step 3: COPPA is enforced by the FTC. HIPAA is health, GLBA is financial institutions, CAN-SPAM is unsolicited commercial email.`},{q:`Under the CCPA as described in the book, within how many days must a business respond to a consumer's access request, free of charge?`,o:[`45 days`,`72 hours`,`6 months`,`There is no deadline`],a:0,e:`Step 3: 45 days. 72 hours is the GDPR breach notification window mentioned in the book.`},{q:`Which best describes PCI DSS?`,o:[`A US federal law passed by Congress`,`An EU regulation that applies only to banks`,`A voluntary code that only large merchants must follow`,`An industry security standard for organizations that accept, transmit or store cardholder data`],a:3,e:`Step 4: PCI DSS applies regardless of size or number of transactions. It is an industry standard, not a law.`},{q:`An EU organization wants to send personal data to a country that has no adequacy decision. Which is a valid approach?`,o:[`Standard contractual clauses, assessed case by case`,`A verbal promise from the recipient`,`Relying on the EU-U.S. Privacy Shield`,`A privacy notice on the website`],a:0,e:`Step 5: SCCs are an appropriate safeguard, and after Schrems II they need a case-by-case assessment. Privacy Shield was invalidated.`},{q:`Which is the first step the book lists when assessing a cross-border transfer?`,o:[`Adopt additional safeguards`,`Map where your data is and where it is transferred to`,`Monitor for ongoing compliance`,`Check that extra measures match business requirements`],a:1,e:`Step 5: map first, then identify the mechanism, assess effectiveness, add safeguards, align with the business, monitor.`},{q:`Which statement about oversight is TRUE according to the chapter?`,o:[`All EU authority rests with a single national regulator`,`In the United States no single agency officially oversees privacy enforcement`,`Canada's OPC can issue fines of up to 4 percent of turnover`,`Every country has a national data protection authority`],a:1,e:`Step 6: the US has many federal and state agencies sharing enforcement.`},{q:`A small privacy office struggles to track constantly changing laws. What does the book suggest?`,o:[`Wait for regulators to contact the company`,`Track only the laws of the home country`,`Consider third-party support such as legal or consultancy services and automated online research services`,`Hire a full-time lawyer in every country`],a:2,e:`Step 6: third-party resources help small offices keep up.`}],ptr:`<div class='trap'><b>Test bank pointers (your own PDF).</b> For this chapter try <b>Questions 10, 16, 17 and 100</b>. Do them in the PDF, then tell your coach each answer and how sure you were. Warning: the PDF's keys are not always reliable. For example, Question 54's marked answer does not match its own explanation. When the book and the key disagree, trust the book and note the question number.</div>`});</script></body></html>
